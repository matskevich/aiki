name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python3 tools/catalog.py check
      - run: python3 tools/release_check.py
      - run: python3 tools/release_manifest.py
      - run: python3 tools/secret_scan.py --download --history
      - run: python3 tools/catalog.py plan orchestration notifications
      - run: python3 -m unittest discover -s tests -v
